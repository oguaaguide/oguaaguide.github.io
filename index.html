<style>
:root{
  --forest:#12352A; --forest-2:#1B4A3A; --forest-3:#2A6150;
  --ivory:#F6F1E7; --paper:#FFFDF8; --sand:#EAE2D2;
  --charcoal:#1E2422; --ink:#1E2422; --muted:#5D6762; --line:#E0D8C8;
  --gold:#C9A24A; --gold-soft:#F1E3BE;
  --bg:var(--ivory); --surface:var(--paper); --text:var(--charcoal);
  --ok:#1F7A4E; --warn:#9A6A12; --pend:#8A5A44;
  --c-stay:#C9A24A; --c-eat:#D9784E; --c-coffee:#9B6B47; --c-drink:#2F8C78; --c-beach:#3E8DB5; --c-late:#6B5BB8; --c-music:#B5527E;
  --head:"Manrope", ui-sans-serif, system-ui, sans-serif; --body:"DM Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --ease:cubic-bezier(.22,.8,.2,1); --r:18px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#141917; --surface:#1C2320; --text:#F1ECE1; --muted:#A8B0AA; --line:#2C3531; --sand:#252D29; --gold-soft:#3A3220; --ok:#5FC28F; --warn:#E0B35A; --pend:#D8A287; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#141917; --surface:#1C2320; --text:#F1ECE1; --muted:#A8B0AA; --line:#2C3531; --sand:#252D29; --gold-soft:#3A3220; --ok:#5FC28F; --warn:#E0B35A; --pend:#D8A287; color-scheme:dark; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--head);letter-spacing:-.02em;margin:0}
img{display:block;max-width:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--forest);z-index:120}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* photo shell with designed placeholder */
.ph{position:relative;overflow:hidden;background:var(--forest-2);isolation:isolate}
.ph::before{content:attr(data-ini);position:absolute;left:14px;bottom:6px;font-family:var(--head);font-weight:800;font-size:clamp(56px,16vw,120px);line-height:.8;letter-spacing:-.05em;color:var(--pc,var(--gold));opacity:.35;z-index:0}
.ph::after{content:"";position:absolute;inset:0;z-index:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 2px,transparent 2px 14px)}
.ph.loading::after{background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.08) 50%,transparent 70%);background-size:220% 100%;animation:shim 1.6s linear infinite}
@keyframes shim{to{background-position:-120% 0}}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.04);transition:opacity .8s var(--ease),transform 1.2s var(--ease);z-index:1}
.ph img.in{opacity:1;transform:none}
.aer{position:absolute;width:768px;height:768px;z-index:0}
.aer img{position:absolute;width:256px;height:256px;opacity:1;transform:none;z-index:0}
.ph.hasaer::before,.ph.hasaer::after{display:none}
.aerpin{position:absolute;z-index:2;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--gold);border:3px solid #fff;box-shadow:0 0 0 6px rgba(201,162,74,.35),0 4px 10px rgba(0,0,0,.4)}
.aerlab{position:absolute;z-index:2;right:10px;bottom:10px;font-size:11px;font-weight:600;color:#fff;background:rgba(0,0,0,.45);padding:3px 8px;border-radius:999px}
.gs .credit{position:absolute;z-index:3;left:12px;bottom:12px;font-size:11.5px;color:#fff;background:rgba(0,0,0,.5);padding:4px 9px;border-radius:999px}
.gs .credit a{color:var(--gold)}
.ph.contain img{object-fit:contain;background:#0D1512}
.ph .noimg{position:absolute;z-index:1;right:10px;bottom:10px;font-size:11px;font-weight:600;color:rgba(246,241,231,.75);background:rgba(0,0,0,.25);padding:3px 8px;border-radius:999px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);border-bottom:1px solid transparent;transition:border-color .3s}
.top.lined{border-bottom-color:var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.brand img{height:34px;width:auto}
.brand span{font-family:var(--head);font-weight:800;font-size:15px;line-height:1.05}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:11.5px;color:var(--muted)}
.nav{display:none;gap:4px;margin-left:auto}
.nav a{text-decoration:none;font-weight:600;font-size:14.5px;padding:9px 13px;border-radius:999px;color:var(--muted);transition:color .2s,background .2s}
.nav a[aria-current="page"]{color:var(--text);background:var(--sand)}
@media (min-width:980px){.nav{display:flex}}
.top .ev{margin-left:auto;font-weight:600;font-size:13.5px;text-decoration:none;padding:8px 12px;border:1px solid var(--line);border-radius:999px}
@media (min-width:980px){.top .ev{display:none}}

/* bottom tab bar (mobile) */
.tabbar{position:fixed;z-index:70;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--forest) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:22px;padding:6px;box-shadow:0 14px 40px rgba(18,53,42,.35)}
.tabbar a{display:grid;justify-items:center;gap:2px;text-decoration:none;color:rgba(246,241,231,.62);font-size:11px;font-weight:600;padding:7px 2px;border-radius:16px;transition:color .2s,background .25s}
.tabbar a svg{width:21px;height:21px}
.tabbar a[aria-current="page"]{color:var(--ivory);background:rgba(246,241,231,.12)}
.tabbar a[aria-current="page"] svg{color:var(--gold)}
@media (min-width:980px){.tabbar{display:none}}
main{padding-bottom:110px}
@media (min-width:980px){main{padding-bottom:40px}}

/* view transitions */
.view{display:none}
.view.on{display:block;animation:vin .55s var(--ease) both}
@keyframes vin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* intro */
#intro{position:fixed;inset:0;z-index:200;background:var(--forest);color:var(--ivory);display:grid;place-items:center;overflow:hidden;transition:opacity .7s var(--ease),visibility .7s}
#intro.gone{opacity:0;visibility:hidden}
#intro .in{display:grid;justify-items:center;text-align:center;gap:14px;padding:20px}
#intro img{width:78px;opacity:0;transform:translateY(10px) scale(.92);animation:up .9s .15s var(--ease) forwards}
#intro h1{font-size:clamp(40px,11vw,84px);font-weight:800;line-height:.95;overflow:hidden}
#intro h1 span{display:block;transform:translateY(105%);animation:rise .9s var(--ease) forwards}
#intro h1 span:nth-child(2){animation-delay:.12s;color:var(--gold)}
#intro p{margin:0;font-size:15px;color:rgba(246,241,231,.75);opacity:0;animation:up .8s .6s var(--ease) forwards}
#intro .skip{position:absolute;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));border:1px solid rgba(246,241,231,.35);background:none;color:var(--ivory);border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px}
#intro .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--gold);width:0;animation:load 2.6s linear forwards}
@keyframes rise{to{transform:none}}
@keyframes up{to{opacity:1;transform:none}}
@keyframes load{to{width:100%}}

/* home hero */
.hero{padding:22px 0 10px}
.hero .wrap{display:grid;gap:26px}
@media (min-width:980px){.hero .wrap{grid-template-columns:1.05fr .95fr;align-items:center;gap:48px;padding-top:30px}}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--forest-3);background:var(--gold-soft);padding:6px 12px;border-radius:999px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .eyebrow{color:var(--gold)}}
.hero h1{font-size:clamp(40px,10.5vw,76px);line-height:.98;font-weight:800;margin:14px 0 14px}
.hero h1 em{font-style:normal;color:var(--forest-3)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero h1 em{color:var(--gold)}}
.hero .lead{margin:0 0 22px;color:var(--muted);font-size:17px;max-width:46ch}
.frame{position:relative;aspect-ratio:4/5;border-radius:200px 200px var(--r) var(--r);overflow:hidden;background:var(--forest);box-shadow:0 30px 60px -30px rgba(18,53,42,.55)}
@media (max-width:979px){.frame{aspect-ratio:5/4;border-radius:160px 160px var(--r) var(--r);order:-1}}
.frame .slide{position:absolute;inset:0;opacity:0;transition:opacity 1.2s var(--ease)}
.frame .slide.on{opacity:1}
.frame .slide .ph{position:absolute;inset:0}
.frame .slide .ph img{transform:scale(1.12);transition:opacity .8s var(--ease),transform 7s linear}
.frame .slide.on .ph img{transform:scale(1)}
.frame .cap{position:absolute;z-index:3;left:12px;right:12px;bottom:12px;display:flex;align-items:center;gap:10px;background:rgba(18,53,42,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--ivory);border:0;border-radius:14px;padding:10px 12px;text-align:left}
.frame .cap b{display:block;font-family:var(--head);font-size:15px}
.frame .cap span{font-size:12.5px;opacity:.8}
.frame .cap svg{margin-left:auto;flex:none}
.frame .ticks{position:absolute;z-index:3;top:16px;left:50%;transform:translateX(-50%);display:flex;gap:5px}
.frame .ticks i{width:6px;height:6px;border-radius:3px;background:rgba(246,241,231,.45);transition:width .4s var(--ease),background .4s}
.frame .ticks i.on{width:20px;background:var(--ivory)}

/* search */
.search{position:relative}
.sbox{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:0 8px 0 16px;box-shadow:0 10px 30px -18px rgba(30,36,34,.35);transition:border-color .2s}
.sbox:focus-within{border-color:var(--forest-3)}
.sbox input{flex:1;min-width:0;border:0;background:none;outline:none;padding:15px 0;font-size:16px}
.sbox input::placeholder{color:var(--muted)}
.sbox button{border:0;background:var(--forest);color:var(--ivory);border-radius:12px;padding:10px 16px;font-weight:600}
.sugg{position:absolute;z-index:30;left:0;right:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 50px -20px rgba(30,36,34,.4);padding:6px;display:none;max-height:56vh;overflow:auto}
.sugg.open{display:block}
.sugg button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:9px 10px;border-radius:12px;text-align:left}
.sugg button:hover,.sugg button.act{background:var(--sand)}
.sugg .th{width:40px;height:40px;border-radius:10px;flex:none}
.sugg .th::before{font-size:22px;left:6px;bottom:3px}
.sugg b{display:block;font-size:14.5px;font-family:var(--head)}
.sugg span{font-size:12.5px;color:var(--muted)}
.sugg .kind{margin-left:auto;font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px;flex:none}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.quick button{border:1px solid var(--line);background:none;border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:500}

/* sections */
.sec{padding-top:56px}
.shead{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:18px}
.shead h2{font-size:clamp(28px,6.5vw,42px);line-height:1.02;font-weight:800}
.shead p{margin:6px 0 0;color:var(--muted);max-width:52ch}
.link{font-weight:600;font-size:14.5px;text-decoration:none;color:var(--forest-3);white-space:nowrap;border-bottom:1.5px solid currentColor;padding-bottom:1px;background:none;border-top:0;border-left:0;border-right:0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .link{color:var(--gold)}}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.reveal.seen{opacity:1;transform:none}

/* category tiles */
.cats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (min-width:980px){.cats{grid-template-columns:repeat(4,1fr)}}
.ctile{position:relative;aspect-ratio:3/4;border-radius:var(--r);overflow:hidden;text-decoration:none;color:var(--ivory)}
.ctile .ph{position:absolute;inset:0}
.ctile .tf{position:absolute;inset:0;opacity:0;transition:opacity 1.2s var(--ease)}
.ctile .tf.on{opacity:1}
.ctile .tf .ph img{transform:scale(1.12);transition:opacity .8s var(--ease),transform 6s linear}
.ctile .tf.on .ph img.in{transform:scale(1)}
.ctile .tilemap{position:absolute;inset:0;background:#1b2a24;pointer-events:none}
.ctile .tilemap .leaflet-control-attribution{display:none}
.ctile .ph img{transition:opacity .8s var(--ease),transform 1.4s var(--ease)}
.ctile:hover .ph img{transform:scale(1.06)}
.ctile::after{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(180deg,rgba(18,53,42,0) 40%,rgba(18,53,42,.9))}
.ctile .t{position:absolute;z-index:3;left:14px;right:14px;bottom:14px}
.ctile b{display:block;font-family:var(--head);font-size:21px;font-weight:800;line-height:1.05}
.ctile span{font-size:13px;opacity:.85}

/* orbit */
.orbit{position:relative;height:min(112vw,520px);isolation:isolate;touch-action:pan-y;user-select:none;-webkit-user-select:none;overflow:hidden;border-radius:28px;background:radial-gradient(120% 90% at 50% 45%,var(--forest-2),var(--forest) 70%)}
.orbit .core{position:absolute;left:50%;top:46%;width:92px;height:92px;margin:-46px 0 0 -46px;border-radius:50%;background:var(--ivory);display:grid;place-items:center;z-index:400;box-shadow:0 0 0 10px rgba(246,241,231,.07),0 0 0 22px rgba(246,241,231,.035)}
.orbit .core img{width:58px}
.orbit .ring{position:absolute;left:50%;top:46%;border:1px dashed rgba(246,241,231,.18);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
.orb{position:absolute;left:0;top:0;width:74px;height:74px;margin:-37px 0 0 -37px;border-radius:50%;border:0;padding:0;background:none;will-change:transform}
.orb .ph{width:100%;height:100%;border-radius:50%;box-shadow:0 0 0 3px var(--forest),0 0 0 5px var(--pc,var(--gold)),0 10px 22px rgba(0,0,0,.4)}
.orb .ph::before{font-size:36px;left:8px;bottom:4px}
.orb .ph .noimg{display:none}
.orbit .label{position:absolute;left:0;right:0;bottom:18px;text-align:center;color:var(--ivory);pointer-events:none}
.orbit .label b{display:block;font-family:var(--head);font-size:21px}
.orbit .label span{font-size:13.5px;opacity:.75}
.orbit .hint{position:absolute;top:16px;left:0;right:0;text-align:center;color:rgba(246,241,231,.6);font-size:13px}

/* rails */
.rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -20px;padding:4px 20px 10px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.room{flex:0 0 min(78vw,330px);scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.room .ph{aspect-ratio:16/10}
.room .b{padding:14px 16px 16px;display:grid;gap:8px}
.room h3{font-size:19px;font-weight:800}
.room .rep{font-weight:700;color:var(--forest-3);font-size:15px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .room .rep{color:var(--gold)}}
.room .sm{font-size:12.5px;color:var(--muted)}
.room .acts{display:flex;gap:8px;margin-top:4px}

.rtile{flex:0 0 min(40vw,180px);aspect-ratio:9/16;border-radius:var(--r);position:relative;overflow:hidden;border:0;padding:0;text-align:left;scroll-snap-align:start;color:#fff}
.rtile .ph{position:absolute;inset:0}
.rtile::after{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(180deg,rgba(0,0,0,.2),transparent 30%,transparent 55%,rgba(0,0,0,.8))}
.rtile .rt{position:absolute;z-index:3;left:12px;right:12px;bottom:12px}
.rtile .rt b{display:block;font-family:var(--head);font-size:15px;line-height:1.15}
.rtile .rt span{font-size:12px;opacity:.85}
.rtile .pl{position:absolute;z-index:3;top:10px;right:10px;width:34px;height:34px;border-radius:50%;background:rgba(246,241,231,.92);display:grid;place-items:center}

.evcard{display:grid;gap:14px;background:var(--forest);color:var(--ivory);border-radius:24px;padding:24px;position:relative;overflow:hidden}
.evcard::after{content:"150";position:absolute;right:-10px;bottom:-34px;font-family:var(--head);font-weight:800;font-size:150px;line-height:1;color:rgba(201,162,74,.18)}
.evcard h3{font-size:26px;font-weight:800}
.evcard p{margin:0;opacity:.85;max-width:44ch}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 16px;font-weight:600;font-size:14.5px;text-decoration:none;white-space:nowrap}
.btn.pri{background:var(--forest);color:var(--ivory)}
.btn.gold{background:var(--gold);color:#1E1A0E}
.btn.out{background:none;border:1px solid var(--line);color:var(--text)}
.btn.ivory{background:var(--ivory);color:var(--forest)}

/* discovery */
.dhead{padding-top:26px}
.abnb{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-top:16px;box-shadow:0 4px 18px rgba(0,0,0,.06)}
.abnb b{display:block;font-size:16px}.abnb span{display:block;font-size:13.5px;color:var(--muted);line-height:1.45;margin-top:2px}
.abico{width:44px;height:44px;border-radius:12px;background:#FF385C;color:#fff;display:grid;place-items:center}.abico svg{width:22px;height:22px}
@media (max-width:560px){.abnb{grid-template-columns:auto 1fr}.abnb .btn{grid-column:1/-1;justify-content:center}}
.flyer{display:block;border:0;background:none;padding:0 20px;margin-top:16px;text-align:left;cursor:zoom-in}
.flyer img{width:100%;max-width:720px;border-radius:16px;box-shadow:0 18px 40px -22px rgba(0,0,0,.5)}
.flyer span{display:block;font-size:12.5px;color:var(--muted);margin-top:6px}
.dhead h1{font-size:clamp(34px,8vw,56px);font-weight:800;line-height:1}
.dhead p{color:var(--muted);margin:8px 0 0;max-width:56ch}
.tools{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:40;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);margin:16px -20px 0;padding:10px 20px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.trow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.trow .sbox{flex:1 1 100%}
@media (min-width:980px){.trow .sbox{flex:1 1 auto}}
.trow .sbox{flex:1;box-shadow:none;padding-left:12px;border-radius:12px}
.trow .sbox input{padding:11px 0;font-size:15.5px}
.sel{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;font-size:14px}
.seg{display:flex;background:var(--sand);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:8px 12px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
@media (min-width:980px){.seg{display:none}}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--cc,var(--gold))}
.chip[aria-pressed="true"]{background:var(--forest);border-color:var(--forest);color:var(--ivory)}
.dbody{display:grid;gap:20px;margin-top:16px}
@media (min-width:980px){.dbody{grid-template-columns:minmax(0,1fr) 440px;align-items:start}}
.count{font-size:13.5px;color:var(--muted);margin:0 0 10px}
.grid{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:640px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column;transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .35s}
.card:hover{transform:translateY(-3px);box-shadow:0 18px 40px -24px rgba(30,36,34,.45)}
.card.hl{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 18px 40px -24px rgba(30,36,34,.45)}
.card .ph{aspect-ratio:4/3}
.card .ph img{transition:opacity .8s var(--ease),transform 1.2s var(--ease)}
.card:hover .ph img.in{transform:scale(1.05)}
.card .badges{position:absolute;z-index:2;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:6px;pointer-events:none}
.pill{font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;background:rgba(18,53,42,.78);color:var(--ivory);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:inline-flex;gap:5px;align-items:center}
.pill.gold{background:var(--gold);color:#1E1A0E}
.card .b{padding:13px 15px 15px;display:grid;gap:5px}
.card h3{font-size:19px;font-weight:800;line-height:1.15}
.card .area{font-size:13.5px;color:var(--muted)}
.card .facts{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--muted);margin-top:4px}
.card .facts span{display:inline-flex;gap:5px;align-items:center}
.card .facts svg{width:14px;height:14px;flex:none}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.isopen{color:var(--ok);font-weight:600}
.mapcol{position:sticky;top:calc(env(safe-area-inset-top,0px) + 186px);height:calc(100vh - 220px);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);display:none}
@media (min-width:980px){.mapcol{display:block}}
.dmap{width:100%;height:100%;background-color:var(--sand);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:36px 36px}
.mobmap{height:62vh;border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.empty{padding:40px 10px;text-align:center;color:var(--muted)}
.pending{margin-top:26px;border-top:1px solid var(--line);padding-top:18px}
.pending h4{font-size:15px;margin-bottom:10px}
.pending ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.pending li{display:flex;justify-content:space-between;gap:10px;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.pending li a{font-weight:600;text-decoration:none;color:var(--forest-3);white-space:nowrap}

/* markers */
.mk{width:34px;height:34px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:var(--mc);border:2.5px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.35);transition:transform .35s var(--ease),box-shadow .35s;display:grid;place-items:center}
.mk span{transform:rotate(45deg);font-family:var(--head);font-weight:800;font-size:11px;color:#fff;letter-spacing:-.02em}
.mk.sel{transform:rotate(-45deg) scale(1.3);box-shadow:0 0 0 5px rgba(201,162,74,.5),0 8px 18px rgba(0,0,0,.4)}
.mk.approx{background:#fff;border-color:var(--mc)}

    L.marker([p.lat,p.lng], {icon:L.divIcon({className:"", html:`<div class="mk-p" style="background:${({approved:"#2459A8",positive:"#1F7A6E",pending:"#9A6A12"})[p.status]||"#2459A8"}">P</div>`, iconSize:[28,28], iconAnchor:[14,14]})}).addTo(pk)
      .bindPopup(`<b>${esc(p.name)}</b><br><span style="font-size:12.5px">${esc(p.tag)}. ${esc(p.note)}</span><br><a href="${gmDir(p.lat,p.lng)}" target="_blank" rel="noopener">Directions in Google Maps</a>`);
    pts.push([p.lat,p.lng]);
  });
  if (opts.parking) pk.addTo(map);
  if (pts.length > 1) map.fitBounds(pts, {padding:[46,46], maxZoom:16});
  let meMk = null, meDot = null, meRing = null;
  const drawMe = p => {
    if (!p) return;
    if (!meMk){
      meRing = L.circle([p.lat,p.lng], {radius:Math.min(p.acc||50,300), color:"#2F7DE1", weight:1, fillOpacity:.12, interactive:false});
      meDot = L.marker([p.lat,p.lng], {icon:L.divIcon({className:"", html:`<div class="mk-me"></div>`, iconSize:[22,22], iconAnchor:[11,11]}), zIndexOffset:1000, title:"You are here"});
      meDot.bindTooltip("You are here", {permanent:true, direction:"top", offset:[0,-12], className:"mlab melab"});
      meDot.bindPopup(() => { const q = Loc.last || p; return `<b>You are here</b><br><span style="font-size:12.5px">Near ${esc(nearPlace(q).name)}</span><br><a class="meetbtn" href="${meetLink(q)}" target="_blank" rel="noopener">Send my spot on WhatsApp</a>`; });
      meMk = L.layerGroup([meRing, meDot]).addTo(map);
    } else { meRing.setLatLng([p.lat,p.lng]).setRadius(Math.min(p.acc||50,300)); meDot.setLatLng([p.lat,p.lng]); }
  };
  const offLoc = Loc.on(p => drawMe(p)); map.on("unload", offLoc);
  if (!opts.noLocate){
    const Ctl = L.Control.extend({ onAdd(){ const b = L.DomUtil.create("button","loc-btn"); b.type = "button"; b.title = "Show where I am"; b.setAttribute("aria-label","Show where I am"); b.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>`;
      L.DomEvent.disableClickPropagation(b); b.onclick = () => { b.classList.add("busy"); api.locate(() => b.classList.remove("busy")); }; return b; } });
    new Ctl({position: opts.rings ? "topleft" : "bottomright"}).addTo(map);
  }
  const api = {
    map, parking:pk,
    select(id, fly=true){
      if (sel && mk[sel]){ mk[sel].m.setIcon(icon(mk[sel].v,false)); mk[sel].m.setZIndexOffset(0); }
      sel = id; const x = mk[id]; if (!x) return;
      x.m.setIcon(icon(x.v,true)); x.m.setZIndexOffset(800);
      if (opts.route) api.route(x.v);
      else if (fly) map.flyTo(x.m.getLatLng(), Math.max(map.getZoom(), 15), {duration: reduce?0:.8});
    },
    async route(v){
      if (routeLayer){ map.removeLayer(routeLayer); routeLayer = null; }
      const from = ME || O, fromName = ME ? "you" : "Mfantsipim School";
      const straight = km(from, v);
      const done = (coords, dist, mins, real) => {
        routeLayer = L.layerGroup([
          L.polyline(coords, {color:"#ffffff", weight:9, opacity:.9}),
          L.polyline(coords, {color:"#12352A", weight:5, opacity:.95, dashArray: real ? null : "8 10", className: real ? "route" : ""})
        ]).addTo(map);
        const mid = coords[Math.floor(coords.length/2)];
        L.marker(mid, {icon:L.divIcon({className:"", html:`<span class="rlab">${dist.toFixed(1)} km${mins?`, ${mins} min drive`:""}<small>from ${fromName}${real?"":", straight line"}</small></span>`, iconSize:[0,0]}), interactive:false}).addTo(routeLayer);
        map.flyToBounds(L.latLngBounds(coords).pad(.35), {duration: reduce?0:.9, maxZoom:16});
        opts.onRoute?.(v.id, dist, mins, real);
      };
      try {
        const ctl = new AbortController(); setTimeout(() => ctl.abort(), 4000);
        const r = await fetch(`https://router.project-osrm.org/route/v1/driving/${from.lng},${from.lat};${v.lng},${v.lat}?overview=full&geometries=geojson`, {signal:ctl.signal});
        const j = await r.json(); const rt = j.routes?.[0]; if (!rt) throw 0;
        if (sel !== v.id) return;
        done(rt.geometry.coordinates.map(([x,y]) => [y,x]), rt.distance/1000, Math.max(2, Math.round(rt.duration/60)), true);
      } catch(e){ if (sel === v.id) done([[from.lat,from.lng],[v.lat,v.lng]], straight*G.roadFactor, Math.max(3, Math.round(straight*G.roadFactor/24*60)), false); }
    },
    locate(cb){
      Loc.ask().then(ok => { const p = Loc.last;
        if (ok && p){ drawMe(p); try { const z = Math.max(map.getZoom(), 15), dy = opts.rings ? Math.round(el.clientHeight*.18) : 0; map.flyTo(map.unproject(map.project([p.lat,p.lng], z).add([0, dy]), z), z, {duration: reduce?0:.8}); } catch(e){} }
        cb?.(ok); });
    }
  };
  setTimeout(() => map.invalidateSize(), 80);
  return api;
}

function buildOrbit(wrap){
  const gen = ++orbitGen;
  const items = V.filter(v => showPics(v).length).slice(0,14);
  const orbs = items.map(v => { const b = h("button","orb"); b.type = "button"; b.setAttribute("aria-label", v.name); b.style.setProperty("--pc", pc(v)); const p = shell(v); lazy(p, showPics(v)[0], "", 300); b.append(p); wrap.append(b); b.onclick = () => { if (!moved) go(v.id); }; return {b, v}; });
  let W, H, cx, cy, rx, ry; const ring = $("#ring", wrap);
  const size = () => { W = wrap.clientWidth; H = wrap.clientHeight; cx = W/2; cy = H*.46; rx = Math.min(W*.4, 360); ry = Math.min(H*.3, 150); ring.style.width = rx*2+"px"; ring.style.height = ry*2+"px"; };
  size(); addEventListener("resize", () => gen===orbitGen && size());
  let ang = 0, vel = reduce ? 0 : .0022, drag = false, lx = 0, moved = false, vis = false, front = null; const lab = $("#olab", wrap), n = orbs.length;
  new IntersectionObserver(es => vis = es[0].isIntersecting).observe(wrap);
  const frame = () => { if (gen !== orbitGen) return;
    if (vis && W){ if (!drag){ ang += vel; vel += ((reduce?0:.0022) - vel)*.03; }
      let best = null, bz = -2;
      orbs.forEach((o,i) => { const a = ang + i*2*Math.PI/n, z = Math.sin(a), s = .58 + (z+1)*.3;
        o.b.style.transform = `translate(${cx+Math.cos(a)*rx}px,${cy+z*ry}px) scale(${s})`; o.b.style.zIndex = Math.round(200+z*100); o.b.style.opacity = .5+(z+1)*.25; if (z > bz){ bz = z; best = o; } });
      if (best && best !== front){ front = best; lab.querySelector("b").textContent = best.v.name; lab.querySelector("span").textContent = best.v.pinned ? `${fmtKm(best.v.d)} from school` : best.v.area; } }
    requestAnimationFrame(frame); };
  requestAnimationFrame(frame);
  wrap.onpointerdown = e => { drag = true; moved = false; lx = e.clientX; };
  addEventListener("pointermove", e => { if (!drag || gen !== orbitGen) return; const dx = e.clientX - lx; if (Math.abs(dx) > 3) moved = true; lx = e.clientX; const d = dx/rx*.9; ang += d; vel = d; });
  addEventListener("pointerup", () => { drag = false; setTimeout(() => moved = false, 60); });
}

function searchBox(host, global){

  const inp = $("input", host), box = $(".sugg", host); let act = -1, items = [];
  const run = () => {
    const q = inp.value.trim().toLowerCase(); box.innerHTML = ""; act = -1;
    if (!q){ box.classList.remove("open"); inp.setAttribute("aria-expanded","false"); return; }
    const vs = V.filter(v => [v.name, v.area, v.blurb, ...v.amen, ...v.cats.map(c=>CATS[c].l)].join(" ").toLowerCase().includes(q)).sort(nearest).slice(0,6);
    const cs = Object.entries(VIEWS).filter(([k,x]) => (x.title+" "+k).toLowerCase().includes(q));

    items = [];
    vs.forEach(v => { const b = h("button","",""); b.type = "button"; b.setAttribute("role","option"); const th = shell(v,"th"); lazy(th, pics(v)[0], "", 200); b.append(th, h("div","",`<b>${esc(v.name)}</b><span>${esc(areaOf(v))}${v.pinned?", "+fmtKm(v.d):""}</span>`), h("span","kind", CATS[v.cats[0]].l)); b.onclick = () => go(v.id); box.append(b); items.push(b); });
    cs.forEach(([k,x]) => { const b = h("button","",`<div><b>${x.title}</b><span>Browse the category</span></div><span class="kind">Category</span>`); b.type="button"; b.onclick = () => go(k); box.append(b); items.push(b); });
    ps.forEach(p => { const b = h("button","",`<div><b>${esc(p)}</b><span>Places in this area</span></div><span class="kind">Area</span>`); b.type="button"; b.onclick = () => { globalQ = p; go("map"); }; box.append(b); items.push(b); });
    if (!items.length) box.append(h("div","empty",`Nothing matches “${esc(inp.value)}” yet.`));
    box.classList.add("open"); inp.setAttribute("aria-expanded","true");
  };
  inp.addEventListener("input", run);
  inp.addEventListener("keydown", e => {
    if (e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault(); if (!items.length) return; act = (act + (e.key==="ArrowDown"?1:-1) + items.length) % items.length; items.forEach((b,i)=>b.classList.toggle("act", i===act)); items[act].scrollIntoView({block:"nearest"}); }
    if (e.key==="Enter"){ e.preventDefault(); (items[act>=0?act:0])?.click(); }
    if (e.key==="Escape"){ box.classList.remove("open"); }
  });
  $("button", host).onclick = () => { if (items[0]) items[0].click(); else run(); };
  document.addEventListener("click", e => { if (!host.contains(e.target)) box.classList.remove("open"); });
}

  const box = it.el; if (box._v) return box._v;
  if (/^assets\/.*\.mp4$/.test(it.id)){ const vd = document.createElement("video"); vd.src = it.id; vd.poster = it.id.replace(/\.mp4$/, ".jpg"); vd.controls = true; vd.playsInline = true; vd.loop = true; vd.muted = muted; vd.preload = "metadata"; vd.title = "Clip from "+it.v.name; box.append(vd); box._v = vd; return vd; }
  if (Media.mode !== "direct"){ box.append(h("div","note","Clips play on the live site. This preview window can only bring in photos from Drive.")); box._v = "none"; return null; }
  const f = document.createElement("iframe"); f.src = `https://drive.google.com/file/d/${it.id}/preview`; f.allow = "autoplay; fullscreen"; f.allowFullscreen = true; f.title = "Clip from "+it.v.name;
  box.append(f); box._v = f; return null;
}
function openReel(list, start=0){
  const tr = $("#rTrack"); tr.innerHTML = ""; reelIO?.disconnect();
  const items = list.map(c => { const el = h("div","ri"); const p = shell(c.v); fill(p, Media.mode==="direct" ? c.id : pics(c.v)[0], "", 1000); el.append(p);
    const ph = c.v.phones?.[0];
    el.append(h("div","ov",`<b>${esc(c.v.name)}</b><span>${esc(areaOf(c.v))}${c.v.pinned?", "+fmtKm(c.v.d)+" from school":""}</span><div class="row"><button class="btn ivory" type="button" data-open="${c.v.id}">Open place</button>${ph?`<a class="btn out" style="color:#fff;border-color:rgba(255,255,255,.4)" href="tel:+${intl(ph)}">Call</a>`:""}</div>`));
    const tap = h("button","tap",`<span>${IC.play}</span>`); tap.type = "button"; tap.setAttribute("aria-label","Play");
    const it = {...c, el};
    tap.onclick = () => { tap.remove(); const vd = startClip(it); vd?.play?.().catch(()=>{}); it.started = true; };
    el.append(tap); tr.append(el); return it; });
  tr.onclick = e => { const b = e.target.closest("[data-open]"); if (b){ closeReel(); go(b.dataset.open); } };
  reelIO = new IntersectionObserver(es => es.forEach(e => { const it = items.find(x => x.el===e.target); if (!it) return;
    if (e.isIntersecting){ $("#rCount").textContent = `${items.indexOf(it)+1} of ${items.length}`; if (items.some(x=>x.started) && !it.started){ it.el.querySelector(".tap")?.remove(); const vd = startClip(it); vd?.play?.().catch(()=>{}); it.started = true; } else if (it._v?.play) it._v.play().catch(()=>{}); }
    else { const vd = it.el._v; if (vd?.pause) vd.pause(); } }), {root:tr, threshold:.6});
  items.forEach(x => reelIO.observe(x.el));
  $("#rMute").innerHTML = muted ? IC.sOff : IC.sOn;
  $("#reel").classList.add("open"); document.body.style.overflow = "hidden";
  requestAnimationFrame(() => tr.scrollTop = start * tr.clientHeight);

  setTimeout(() => items[start]?.el.querySelector(".tap")?.click(), 250);
}

/* ---------- grand entry reminder pop-up ---------- */
function gePop(){
  const ge = G.grandEntry; if (!ge?.day) return;
  const today = new Date().toISOString().slice(0,10);
  if (today > ge.day) return;
  const dt = Math.round((Date.parse(ge.day) - Date.parse(today)) / 864e5);
  const KEY = "oguaa-gepop-" + today;
  try { if (localStorage.getItem(KEY)) return; } catch(e){}
  const head = dt === 0 ? "Today: the Grand Entry" : dt === 1 ? "Tomorrow: the Grand Entry" : `Grand Entry: ${ge.date.replace(" 2026","")}`;
  const body = dt === 0 ? "Accra escort leaves West Hills Mall at 10:00 AM. Grand Entry starts 2:00 PM at Aggrey Memorial." : "Wed 11 Nov: Accra escort departs 10:00 AM, Grand Entry starts 2:00 PM. See the final route.";
  const el = h("aside","gepop"); el.setAttribute("role","status");
  el.innerHTML = `<button type="button" class="gpx" aria-label="Close">&times;</button><div class="gpi">${sfi("car",2)}</div><div><small>${esc(ge.status)}</small><b>${esc(head)}</b><p>${esc(body)}</p></div><div class="gpa"><a class="btn pri" href="#event" data-gepop>See the route</a></div>`;
  document.body.append(el);
  const close = () => { el.classList.remove("in"); try { localStorage.setItem(KEY, "1"); } catch(e){} setTimeout(() => el.remove(), 700); };
  $(".gpx", el).onclick = close;
  $("[data-gepop]", el).onclick = e => { e.preventDefault(); close(); if (location.hash !== "#event") location.hash = "event"; setTimeout(() => document.getElementById("ev-ge")?.scrollIntoView({behavior: reduce?"auto":"smooth", block:"start"}), 450); };
  const show = () => { if (current === "event" || !el.isConnected) return; el.classList.add("in"); };
  setTimeout(show, 3800);
  addEventListener("hashchange", () => { if (location.hash.slice(1) === "event") el.classList.remove("in"); });
}

/* ---------- routing ---------- */
const VIEWKEYS = ["home","stay","dining","nightlife","map","event","safety"];
let current = null;
function bindGo(root){ $$("[data-go]", root).forEach(a => a.addEventListener("click", e => { e.preventDefault(); go(a.dataset.go); })); }
function go(target){ if (location.hash.slice(1) !== target) location.hash = target; else route(); }
function route(){
  const t = location.hash.slice(1) || "home";
  if (byId(t)){ if (!current){ vp._direct = true; showView("home"); } vp._id = t; openVenue(t); return; }
  if (vp.classList.contains("open")){ vp.classList.remove("open"); document.body.style.overflow = ""; miniApi?.map.remove(); miniApi = null; vp._lk?.remove(); vp._lk = null; }
  closeReel(); $("#lb").classList.remove("open");
  showView(VIEWKEYS.includes(t) ? t : "home");
}
function showView(k){
  if (current === k && !globalQ) return;
  current = k;
  $$(".view").forEach(v => v.classList.toggle("on", v.id === "v-"+k));
  $$("[data-go]").forEach(a => a.getAttribute("href") && a.setAttribute("aria-current", a.dataset.go===k ? "page" : "false"));
  if (k==="home") home(); else if (VIEWS[k]) discovery(k); else if (k==="map") explore(); else if (k==="event") eventView(); else if (k==="safety") safetyView();
  scrollTo({top:0, behavior:"auto"});
}
addEventListener("hashchange", route);
addEventListener("keydown", e => { if (e.key==="Escape"){ if ($("#lb").classList.contains("open")) $("#lb").classList.remove("open"); else if ($("#reel").classList.contains("open")) closeReel(); else closeVenue(); } });
addEventListener("scroll", () => $("#top").classList.toggle("lined", scrollY > 8), {passive:true});
bindGo(document);

/* ---------- live Drive folders: new photos appear without a rebuild (preview) ---------- */
const norm = s => s.toLowerCase().replace(/[^a-z]/g,"");
async function liveSync(){
  await Media.ready; if (Media.mode!=="mcp" || !G.driveRoot) return false;
  try {
    const folders = (await Media.list(`parentId = '${G.driveRoot}'`)).filter(f => f.mimeType==="application/vnd.google-apps.folder");
    let changed = false;
    await Promise.all(folders.map(async f => {
      const key = norm(f.title);
      const v = V.find(x => x.folderId===f.id || norm(x.folder||"")===key || key.includes(norm(x.name).slice(0,10)) || norm(x.name).includes(key.slice(0,10)));
      if (!v) return;
      const files = await Media.list(`parentId = '${f.id}'`); const md = {img:[], vid:[], shot:[]};
      files.sort((a,b)=>a.title.localeCompare(b.title)).forEach(x => { if (x.mimeType?.startsWith("video/")) md.vid.push(x.id); else if (/^screenshot/i.test(x.title)) md.shot.push(x.id); else if (x.mimeType?.startsWith("image/")) md.img.push(x.id); });
      if (files.length && JSON.stringify(md) !== JSON.stringify(v.media)){ v.media = md; changed = true; }
    }));
    return changed;
  } catch(e){ return false; }
}

/* ---------- boot ---------- */
const intro = $("#intro"); let introDone = false;
const endIntro = () => { if (introDone) return; introDone = true; intro.classList.add("gone"); try { sessionStorage.setItem("moba150-intro","1"); } catch(e){} };
let seen = false; try { seen = !!sessionStorage.getItem("moba150-intro"); } catch(e){}
if (reduce || seen || location.hash.slice(1)) endIntro(); else { setTimeout(endIntro, 2700); $("#skip").onclick = endIntro; }
try { gePop(); } catch(e){}
Media.ready.then(route);
liveSync().then(ch => { if (ch){ const k = current; current = null; showView(k); } });
})();
